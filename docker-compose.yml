services:
  barcode-service:
    build:
      context: .
      dockerfile: barcode-service/Dockerfile
    container_name: barcode-service
    ports:
      - "127.0.0.1:8080:8080"     # ← 只绑 localhost
    restart: unless-stopped

  web-service:
    build:
      context: .
      dockerfile: web-service/Dockerfile
    container_name: web-service
    ports:
      - "127.0.0.1:8081:8081"     # ← 只绑 localhost
    restart: unless-stopped